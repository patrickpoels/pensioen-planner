<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PensioenPlanner</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pensioen">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%232563eb'/%3E%3Cpath d='M30 70 L30 50 M50 70 L50 30 M70 70 L70 45' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        body { 
            -webkit-tap-highlight-color: transparent; 
            font-feature-settings: "tnum"; 
            font-size: 10px; /* Terug naar compact */
            padding-top: env(safe-area-inset-top);
        }
        
        .table-container { 
            max-height: calc(100vh - 300px); 
            overflow-y: auto; 
            border-radius: 0.75rem; 
        }

        th { 
            position: sticky; top: 0; background: #f8fafc; z-index: 40; 
            border-bottom: 2px solid #e2e8f0; white-space: nowrap; 
            font-size: 8px; padding: 6px 4px; text-transform: uppercase;
        }
        
        .row-good { background-color: #dcfce7 !important; } 
        .row-bad { background-color: #fff7ed !important; }  
        .row-bankrupt { background-color: #fee2e2 !important; color: #b91c1c !important; font-weight: bold; }

        .input-group { @apply flex items-center gap-1 bg-transparent border-b border-transparent focus-within:border-blue-500 focus-within:bg-white transition; }
        .input-cell { @apply w-full bg-transparent py-0.5 text-right outline-none font-bold text-[10px]; }
        .fill-btn { @apply p-1 text-blue-400 active:text-blue-800 transition text-[10px] opacity-0 group-hover:opacity-100; }
        
        .card { @apply bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden; }
        #resetModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div id="resetModal" class="no-print">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-xs w-full mx-4 text-center">
            <h3 class="text-base font-bold mb-2 text-slate-800 uppercase tracking-tighter">Alles op nul zetten?</h3>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 px-4 py-2 bg-slate-100 rounded-xl font-bold text-xs uppercase">Nee</button>
                <button onclick="confirmReset()" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-xl font-bold text-xs uppercase">Ja</button>
            </div>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto p-3">
        <header class="mb-3 flex items-center justify-between">
            <h1 class="text-lg font-black text-slate-800 tracking-tighter italic leading-none">Pensioen<span class="text-blue-600">Planner</span></h1>
            <div class="flex gap-2 no-print">
                <button onclick="openResetModal()" class="bg-white border px-3 py-1 rounded-lg text-[9px] font-bold uppercase">Wissen</button>
                <button onclick="shuffleAndRun()" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-[9px] font-bold shadow-md shadow-blue-200 uppercase">Herschud</button>
            </div>
        </header>

        <!-- Stats Dashboard -->
        <div class="grid grid-cols-4 gap-2 mb-3 text-center">
            <div class="card p-2 bg-blue-600 text-white border-none">
                <p class="text-[7px] font-bold uppercase mb-0.5 opacity-80">Eindkapitaal</p>
                <h2 id="endResultText" class="text-xs font-black tracking-tight leading-none">€ 0</h2>
            </div>
            <div class="card p-2 border-l-2 border-l-blue-500">
                <p class="text-slate-400 text-[7px] font-bold uppercase mb-0.5">Totaal Inleg</p>
                <h2 id="totalInlayText" class="text-xs font-black text-slate-800 leading-none">€ 0</h2>
            </div>
            <div class="card p-2 border-l-2 border-l-green-500">
                <p class="text-slate-400 text-[7px] font-bold uppercase mb-0.5">Netto Rend.</p>
                <h2 id="totalReturnText" class="text-xs font-black text-slate-800 leading-none">0%</h2>
            </div>
            <div class="card p-2 border-l-2 border-l-orange-500">
                <p class="text-slate-400 text-[7px] font-bold uppercase mb-0.5">Drempel Nu</p>
                <h2 id="thresholdValueText" class="text-xs font-black text-slate-800 leading-none">€ 0</h2>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-3">
            <aside class="col-span-3 space-y-3 no-print">
                <div class="card p-3">
                    <div class="space-y-3">
                        <div>
                            <label class="block text-[7px] font-bold text-slate-400 uppercase mb-0.5">Strategie</label>
                            <select id="selectedEtf" class="w-full bg-slate-50 border rounded-lg px-2 py-1 font-bold text-[9px] outline-none" onchange="updateGlobalParam('selectedEtf', this.value)">
                                <option value="msci_acwi">MSCI ACWI (5.1%)</option>
                                <option value="msci_world">MSCI World (5.5%)</option>
                                <option value="sp500">S&P 500 (6.8%)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[7px] font-bold text-slate-400 uppercase mb-0.5">Lft Start</label>
                                <input type="number" id="currentAge" value="65" class="w-full bg-slate-50 border rounded-lg px-2 py-1 font-bold text-[9px]" onchange="updateGlobalParam('currentAge', this.value)">
                            </div>
                            <div>
                                <label class="block text-[7px] font-bold text-slate-400 uppercase mb-0.5">Grens %</label>
                                <input type="number" id="threshold" value="4" class="w-full bg-slate-50 border rounded-lg px-2 py-1 font-bold text-blue-600 text-[9px]" onchange="updateGlobalParam('threshold', this.value)">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[7px] font-bold text-slate-400 uppercase mb-0.5">Start ETF (€)</label>
                            <input type="number" id="startEtf" value="0" class="w-full bg-slate-50 border rounded-lg px-2 py-1 font-bold text-[9px]" onchange="updateGlobalParam('startEtf', this.value)">
                        </div>
                        <div>
                            <label class="block text-[7px] font-bold text-slate-400 uppercase mb-0.5">Start Cash (€)</label>
                            <input type="number" id="startCash" value="0" class="w-full bg-slate-50 border rounded-lg px-2 py-1 font-bold text-[9px]" onchange="updateGlobalParam('startCash', this.value)">
                        </div>
                        <div>
                            <label class="block text-[7px] font-bold text-slate-400 uppercase mb-0.5">Max Cash (€)</label>
                            <input type="number" id="maxCash" value="200000" class="w-full bg-slate-50 border rounded-lg px-2 py-1 font-bold text-orange-600 text-[9px]" onchange="updateGlobalParam('maxCash', this.value)">
                        </div>
                    </div>
                </div>
            </aside>

            <main class="col-span-9">
                <div class="card shadow-sm">
                    <div class="table-container">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-slate-400 border-b">
                                    <th class="border-r w-8 text-center">Lft</th>
                                    <th class="w-16">In Ik</th>
                                    <th class="w-16">Partner</th>
                                    <th class="w-16 text-blue-600">Inleg</th>
                                    <th class="w-16 border-r">Budget</th>
                                    <th class="text-right">Rend%</th>
                                    <th class="text-right text-blue-600">Inleg Cum.</th>
                                    <th class="text-right text-orange-600">Drempel</th>
                                    <th class="text-right">ETF Stand</th>
                                    <th class="text-right">Cash</th>
                                    <th class="bg-slate-50 text-right font-black border-l">Totaal</th>
                                </tr>
                            </thead>
                            <tbody id="simulationBody"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const BASE_RETURNS = [
            0.152, -0.084, 0.041, 0.195, -0.062, 0.121, 0.245, -0.210, 0.015, 0.092,
            -0.145, 0.182, 0.054, -0.021, 0.165, 0.082, -0.042, 0.221, -0.124, 0.061,
            0.175, 0.032, -0.081, 0.214, 0.042, -0.285, 0.124, 0.081, -0.015, 0.185,
            0.112, -0.062, 0.071, 0.142, -0.165, 0.192, 0.022, -0.031, 0.245, -0.092,
            0.081, 0.042, -0.065, 0.182, 0.121, -0.145, 0.212, 0.015, -0.041, 0.132,
            0.152, -0.221, 0.082, 0.054, -0.025, 0.284, -0.092, 0.071, 0.124, -0.185,
            0.162, 0.031, -0.054, 0.242, 0.065, -0.042, 0.091, 0.215, -0.112, 0.024,
            0.142, 0.051, -0.015, 0.184, 0.082
        ];

        const ETF_DATA = {
            "msci_acwi": { returns: BASE_RETURNS },
            "msci_world": { returns: BASE_RETURNS.map(r => r * 1.05 + 0.002) },
            "sp500": { returns: BASE_RETURNS.map(r => r * 1.18 + 0.012) }
        };

        let state = {
            selectedEtf: "msci_acwi", currentAge: 65, startEtf: 0, startCash: 0,
            threshold: 4, maxCash: 200000, shuffleIndices: Array.from({length: BASE_RETURNS.length}, (_, i) => i),
            yearlyManualInputs: {} 
        };

        function saveState() { localStorage.setItem('pensioen_final_v5', JSON.stringify(state)); }
        function loadState() {
            const saved = localStorage.getItem('pensioen_final_v5');
            if (saved) {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
                // Zorg dat de index-array nooit langer is dan de data (voorkomt NaN)
                state.shuffleIndices = state.shuffleIndices.filter(i => i < BASE_RETURNS.length);
                Object.keys(state).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = state[k]; });
            }
        }

        function clearColumn(type) {
            for (let i = state.currentAge; i <= 90; i++) state.yearlyManualInputs[`${i}_${type}`] = 0;
            saveState(); runSimulation();
        }

        function fillDown(age, type) {
            const val = state.yearlyManualInputs[`${age}_${type}`] ?? 0;
            for (let i = age + 1; i <= 90; i++) state.yearlyManualInputs[`${i}_${type}`] = val;
            saveState(); runSimulation();
        }

        function updateGlobalParam(id, val) {
            state[id] = (id === 'selectedEtf') ? val : parseFloat(val);
            saveState(); runSimulation();
        }

        function updateManualVal(age, type, val) {
            state.yearlyManualInputs[`${age}_${type}`] = val === '' ? 0 : parseFloat(val);
            saveState(); runSimulation();
        }

        function openResetModal() { document.getElementById('resetModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('resetModal').style.display = 'none'; }
        function confirmReset() { state.yearlyManualInputs = {}; saveState(); runSimulation(); closeModal(); }
        function shuffleAndRun() { 
            state.shuffleIndices = Array.from({length: BASE_RETURNS.length}, (_, i) => i);
            state.shuffleIndices.sort(() => Math.random() - 0.5); 
            saveState(); runSimulation(); 
        }

        function runSimulation() {
            const tbody = document.getElementById('simulationBody');
            tbody.innerHTML = '';

            let currentEtf = state.startEtf; 
            let currentCash = state.startCash;
            let runningTotalIn = state.startEtf + state.startCash;
            let currentDrempel = state.startEtf;

            const thresholdPct = state.threshold / 100;
            const activeReturns = ETF_DATA[state.selectedEtf].returns;

            for (let age = state.currentAge; age <= 90; age++) {
                const yearIdx = age - state.currentAge;
                const p1 = state.yearlyManualInputs[`${age}_p1`] ?? 0;
                const p2 = state.yearlyManualInputs[`${age}_p2`] ?? 0;
                const inv = state.yearlyManualInputs[`${age}_inv`] ?? 0;
                const budget = state.yearlyManualInputs[`${age}_budget`] ?? 0;

                let rowColor = "row-bad";
                let needs = Math.max(0, budget - (p1 + p2));

                // --- 1. OOGST (1 Jan, vanaf Jaar 2) ---
                if (age > state.currentAge) {
                    if (currentEtf > currentDrempel) {
                        rowColor = "row-good";
                        let surplus = currentEtf - currentDrempel;
                        
                        let taken = Math.min(needs, surplus);
                        currentEtf -= taken;
                        currentDrempel -= taken;
                        needs -= taken;

                        surplus = currentEtf - currentDrempel;
                        if (currentCash < state.maxCash && surplus > 0) {
                            let refill = Math.min(state.maxCash - currentCash, surplus);
                            currentEtf -= refill;
                            currentDrempel -= refill;
                            currentCash += refill;
                        }
                    }
                }

                // --- 2. RESTANT BUDGET (Cash of Geforceerd) ---
                let fromCash = Math.min(needs, Math.max(0, currentCash));
                currentCash -= fromCash;
                needs -= fromCash;

                if (needs > 0) {
                    let forced = Math.min(needs, Math.max(0, currentEtf));
                    currentEtf -= forced;
                    currentDrempel -= forced;
                    needs -= forced;
                }

                // --- 3. INLEG (1 Jan) ---
                if (inv > 0) {
                    currentEtf += inv;
                    currentDrempel += inv;
                    runningTotalIn += inv;
                }

                const displayDrempel = currentDrempel;

                // --- 4. MARKTGROEI ---
                // NOOIT NaN: gebruik modulo op de shuffle array lengte
                const dataIndex = state.shuffleIndices[yearIdx % state.shuffleIndices.length];
                const annualReturn = activeReturns[dataIndex] || 0;
                if (currentEtf > 0) currentEtf *= (1 + annualReturn);

                // --- 5. FINISH JAAR ---
                const totaal = currentEtf + currentCash;
                if (totaal <= 0) rowColor = "row-bankrupt";
                currentDrempel *= (1 + thresholdPct);

                // RENDERING
                const row = document.createElement('tr');
                row.className = `border-b group transition ${rowColor}`;
                
                const cell = (type, val, cls='') => `
                    <td class="p-0 border-slate-200/50">
                        <div class="input-group">
                            <input type="number" value="${Math.round(val)||''}" placeholder="0" class="input-cell ${cls}" onchange="updateManualVal(${age}, '${type}', this.value)">
                            <span class="fill-btn no-print" onclick="fillDown(${age}, '${type}')">⬇️</span>
                        </div>
                    </td>`;

                row.innerHTML = `
                    <td class="p-1 font-bold border-r text-center text-slate-400 bg-slate-50/20 italic">${age}</td>
                    ${cell('p1', p1)} ${cell('p2', p2)} ${cell('inv', inv, 'text-blue-600')} ${cell('budget', budget, 'text-slate-900')}
                    <td class="p-1 text-right font-mono border-l ${annualReturn>=0?'text-green-600':'text-red-500'}">${(annualReturn*100).toFixed(1)}%</td>
                    <td class="p-1 text-right font-mono text-blue-600">€${Math.round(runningTotalIn).toLocaleString('nl-BE')}</td>
                    <td class="p-1 text-right font-mono text-orange-600 font-bold">€${Math.round(displayDrempel).toLocaleString('nl-BE')}</td>
                    <td class="p-1 text-right font-mono font-bold">€${Math.round(currentEtf).toLocaleString('nl-BE')}</td>
                    <td class="p-1 text-right font-mono">€${Math.round(currentCash).toLocaleString('nl-BE')}</td>
                    <td class="p-1 text-right font-mono font-black border-l bg-slate-50/20">€${Math.round(totaal).toLocaleString('nl-BE')}</td>
                `;
                tbody.appendChild(row);

                if (age === state.currentAge) document.getElementById('thresholdValueText').innerText = `€ ${Math.round(displayDrempel).toLocaleString('nl-BE')}`;
                if (age === 90) {
                    document.getElementById('endResultText').innerText = `€ ${Math.round(totaal).toLocaleString('nl-BE')}`;
                    document.getElementById('totalReturnText').innerText = runningTotalIn > 0 ? Math.round(((totaal / runningTotalIn)-1)*100)+"%" : "0%";
                    document.getElementById('totalInlayText').innerText = `€ ${Math.round(runningTotalIn).toLocaleString('nl-BE')}`;
                }
            }
        }

        window.onload = () => { loadState(); runSimulation(); };
    </script>
</body>
</html>
