<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PensioenPlanner</title>
    
    <!-- PWA / iOS App instellingen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pensioen">
    
    <!-- App Icoon (SVG Data URI voor direct resultaat op iPhone) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M30 70 L30 50 M50 70 L50 30 M70 70 L70 45' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">

    <!-- Web Manifest (inline) -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22PensioenPlanner%22%2C%22short_name%22%3A%22Pensioen%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%232563eb%22%7D">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* UI optimalisaties voor mobiel */
        body { 
            -webkit-tap-highlight-color: transparent; 
            padding-top: env(safe-area-inset-top); 
            padding-bottom: env(safe-area-inset-bottom);
        }

        .table-container { 
            max-height: calc(100vh - 380px); 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            border-radius: 0.75rem; 
        }

        th { position: sticky; top: 0; background: #f8fafc; z-index: 30; border-bottom: 2px solid #e2e8f0; white-space: nowrap; line-height: 1.1; padding: 10px 6px; }
        
        /* Kleuren voor rijen */
        .row-good-year { background-color: #dcfce7 !important; }
        .row-bad-year { background-color: #fff7ed !important; }
        .row-bankrupt { background-color: #fee2e2 !important; color: #b91c1c !important; }
        
        .input-group { @apply flex items-center gap-1 bg-transparent border-b border-transparent focus-within:border-blue-500 focus-within:bg-white transition px-1; }
        .input-cell { @apply w-full bg-transparent py-1 text-right outline-none text-xs font-semibold; }
        
        /* Touch-vriendelijke knoppen op iPad/iPhone */
        .fill-btn { @apply p-2 text-blue-400 active:text-blue-700 transition text-base; }
        @media (hover: hover) { .fill-btn { @apply opacity-0 group-hover:opacity-100 p-1 text-[10px]; } }

        .card { @apply bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden; }
        #resetModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen select-none md:select-auto">

    <!-- Modal voor Reset -->
    <div id="resetModal" class="no-print">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4">
            <h3 class="text-xl font-bold text-slate-800 mb-2 text-center">Tabel wissen?</h3>
            <p class="text-slate-500 text-sm mb-6 text-center">Alle kolommen worden op nul gezet.</p>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 px-4 py-3 bg-slate-100 text-slate-700 rounded-2xl font-bold active:scale-95 transition">Annuleren</button>
                <button onclick="confirmReset()" class="flex-1 px-4 py-3 bg-red-600 text-white rounded-2xl font-bold active:scale-95 transition">Wis alles</button>
            </div>
        </div>
    </div>

    <div class="max-w-[1600px] mx-auto p-4 md:p-8">
        <header class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">Pensioen<span class="text-blue-600">Planner</span></h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-1">Groei eerst, dan pas oogsten</p>
            </div>
            <div class="flex justify-center gap-2 no-print">
                <button onclick="openResetModal()" class="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl font-bold active:bg-slate-100 text-xs shadow-sm">Reset</button>
                <button onclick="shuffleAndRun()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold shadow-lg shadow-blue-200 active:scale-95 transition text-xs">Herschud Markt</button>
            </div>
        </header>

        <!-- Dashboard -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-6 mb-6">
            <div class="card p-4 bg-blue-600 text-white border-none shadow-md">
                <p class="text-blue-100 text-[9px] font-bold uppercase mb-1">Eindkapitaal (90j)</p>
                <h2 id="endResultText" class="text-xl md:text-2xl font-black">€ 0</h2>
            </div>
            <div class="card p-4 border-l-4 border-l-blue-500">
                <p class="text-slate-400 text-[9px] font-bold uppercase mb-1">Totaal Inleg</p>
                <h2 id="totalInlayText" class="text-xl md:text-2xl font-black text-slate-800">€ 0</h2>
            </div>
            <div class="card p-4 border-l-4 border-l-green-500">
                <p class="text-slate-400 text-[9px] font-bold uppercase mb-1">Rendement</p>
                <h2 id="totalReturnText" class="text-xl md:text-2xl font-black text-slate-800">0%</h2>
            </div>
            <div class="card p-4 border-l-4 border-l-orange-500">
                <p class="text-slate-400 text-[9px] font-bold uppercase mb-1">Drempel Nu</p>
                <h2 id="thresholdValueText" class="text-xl md:text-2xl font-black text-slate-800">€ 0</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Settings Sidebar -->
            <aside class="lg:col-span-3 space-y-4 no-print">
                <div class="card p-5 border-blue-50">
                    <h3 class="font-bold text-slate-800 mb-4 text-xs uppercase tracking-widest">Systeem</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">ETF Strategie</label>
                            <select id="selectedEtf" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold outline-none text-xs" onchange="updateGlobalParam('selectedEtf', this.value)">
                                <option value="msci_acwi">MSCI ACWI (5.1%)</option>
                                <option value="msci_world">MSCI World (5.5%)</option>
                                <option value="sp500">S&P 500 (6.8%)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Leeftijd</label>
                                <input type="number" id="currentAge" value="65" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-xs" onchange="updateGlobalParam('currentAge', this.value)">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Grens %</label>
                                <input type="number" id="threshold" value="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-blue-600 text-xs" onchange="updateGlobalParam('threshold', this.value)">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Start ETF (€)</label>
                            <input type="number" id="startEtf" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-xs" onchange="updateGlobalParam('startEtf', this.value)">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Start Cash (€)</label>
                            <input type="number" id="startCash" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-xs" onchange="updateGlobalParam('startCash', this.value)">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Max Cash Buffer (€)</label>
                            <input type="number" id="maxCash" value="200000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-orange-600 text-xs" onchange="updateGlobalParam('maxCash', this.value)">
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Dashboard Table -->
            <main class="lg:col-span-9">
                <div class="card shadow-lg">
                    <div class="table-container">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-slate-400 font-bold uppercase text-[8px] md:text-[9px] tracking-tight border-b">
                                    <th class="border-r w-10 text-center">Lft</th>
                                    <th class="w-20 group">Pens. Ik <span class="reset-header-btn no-print" onclick="clearColumn('p1')">🗑️</span></th>
                                    <th class="w-20 group">Partner <span class="reset-header-btn no-print" onclick="clearColumn('p2')">🗑️</span></th>
                                    <th class="w-20 group text-blue-600">Inleg <span class="reset-header-btn no-print" onclick="clearColumn('inv')">🗑️</span></th>
                                    <th class="w-20 group border-r">Budget <span class="reset-header-btn no-print" onclick="clearColumn('budget')">🗑️</span></th>
                                    <th class="text-right">Rend%</th>
                                    <th class="text-right text-blue-600">Totaal In</th>
                                    <th class="text-right text-orange-600">Drempel</th>
                                    <th class="text-right">ETF</th>
                                    <th class="text-right">Cash</th>
                                    <th class="bg-slate-50 text-right font-black border-l">Totaal</th>
                                </tr>
                            </thead>
                            <tbody id="simulationBody" class="text-[10px] md:text-[11px]"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const BASE_RETURNS = [
            0.152, -0.084, 0.041, 0.195, -0.062, 0.121, 0.245, -0.210, 0.015, 0.092,
            -0.145, 0.182, 0.054, -0.021, 0.165, 0.082, -0.042, 0.221, -0.124, 0.061,
            0.175, 0.032, -0.081, 0.214, 0.042, -0.285, 0.124, 0.081, -0.015, 0.185,
            0.112, -0.062, 0.071, 0.142, -0.165, 0.192, 0.022, -0.031, 0.245, -0.092,
            0.081, 0.042, -0.065, 0.182, 0.121, -0.145, 0.212, 0.015, -0.041, 0.132,
            0.152, -0.221, 0.082, 0.054, -0.025, 0.284, -0.092, 0.071, 0.124, -0.185,
            0.162, 0.031, -0.054, 0.242, 0.065, -0.042, 0.091, 0.215, -0.112, 0.024,
            0.142, 0.051, -0.015, 0.184, 0.082
        ];

        const ETF_DATA = {
            "msci_acwi": { returns: BASE_RETURNS },
            "msci_world": { returns: BASE_RETURNS.map(r => r * 1.05 + 0.002) },
            "sp500": { returns: BASE_RETURNS.map(r => r * 1.18 + 0.012) }
        };

        let state = {
            selectedEtf: "msci_acwi",
            currentAge: 65,
            startEtf: 0,
            startCash: 0,
            threshold: 4,
            maxCash: 200000,
            shuffleIndices: Array.from({length: BASE_RETURNS.length}, (_, i) => i),
            yearlyManualInputs: {} 
        };

        function saveState() { localStorage.setItem('pensioen_pwa_v1', JSON.stringify(state)); }
        function loadState() {
            const saved = localStorage.getItem('pensioen_pwa_v1');
            if (saved) {
                state = { ...state, ...JSON.parse(saved) };
                document.getElementById('selectedEtf').value = state.selectedEtf;
                document.getElementById('currentAge').value = state.currentAge;
                document.getElementById('startEtf').value = state.startEtf;
                document.getElementById('startCash').value = state.startCash;
                document.getElementById('threshold').value = state.threshold;
                document.getElementById('maxCash').value = state.maxCash;
            }
        }

        function clearColumn(type) {
            for (let i = state.currentAge; i <= 90; i++) state.yearlyManualInputs[`${i}_${type}`] = 0;
            saveState(); runSimulation();
        }

        function fillDown(age, type) {
            const val = state.yearlyManualInputs[`${age}_${type}`] ?? 0;
            for (let i = age + 1; i <= 90; i++) state.yearlyManualInputs[`${i}_${type}`] = val;
            saveState(); runSimulation();
        }

        function updateGlobalParam(id, val) {
            state[id] = (id === 'selectedEtf') ? val : parseFloat(val);
            saveState(); runSimulation();
        }

        function updateManualVal(age, type, val) {
            const key = `${age}_${type}`;
            state.yearlyManualInputs[key] = val === '' ? 0 : parseFloat(val);
            saveState(); runSimulation();
        }

        function openResetModal() { document.getElementById('resetModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('resetModal').style.display = 'none'; }
        function confirmReset() { state.yearlyManualInputs = {}; saveState(); runSimulation(); closeModal(); }
        function shuffleAndRun() { state.shuffleIndices.sort(() => Math.random() - 0.5); saveState(); runSimulation(); }

        function runSimulation() {
            const tbody = document.getElementById('simulationBody');
            tbody.innerHTML = '';

            let currentEtfValue = state.startEtf * 0.9988; 
            let currentCashValue = state.startCash;
            let runningTotalInvested = state.startEtf + state.startCash;
            let compoundedThreshold = state.startEtf;

            const thresholdPct = state.threshold / 100;
            const activeEtfReturns = ETF_DATA[state.selectedEtf].returns;

            for (let age = state.currentAge; age <= 90; age++) {
                const yearIdx = age - state.currentAge;
                const p1 = state.yearlyManualInputs[`${age}_p1`] ?? 0;
                const p2 = state.yearlyManualInputs[`${age}_p2`] ?? 0;
                const inv = state.yearlyManualInputs[`${age}_inv`] ?? 0;
                const budget = state.yearlyManualInputs[`${age}_budget`] ?? 0;

                let rowColorClass = "row-bad-year";
                let isGoodYear = false;

                // --- 1. BESLISSING (Eerst groeijaar laten passeren) ---
                if (age > state.currentAge) {
                    isGoodYear = currentEtfValue > compoundedThreshold;
                    if (isGoodYear) {
                        rowColorClass = "row-good-year";
                        let surplus = currentEtfValue - compoundedThreshold;
                        let annualDeficit = Math.max(0, budget - (p1 + p2));
                        
                        let harvest = Math.min(annualDeficit, surplus / 1.0012);
                        currentEtfValue -= harvest * 1.0012;
                        
                        surplus = currentEtfValue - compoundedThreshold;
                        if (currentCashValue < state.maxCash && surplus > 0) {
                            let refill = Math.min(state.maxCash - currentCashValue, surplus / 1.0012);
                            currentEtfValue -= refill * 1.0012;
                            currentCashValue += refill;
                        }
                    }
                }

                // --- 2. ONTTREKKING VOOR BUDGET ---
                let currentDeficit = Math.max(0, budget - (p1 + p2));
                // Als we in Good Year al geoogst hebben, wordt dat hier niet dubbel gedaan 
                // omdat currentEtfValue al lager is en we de volgorde respecteren.
                // (Logica: we dekken de rest uit Cash, dan forced uit ETF)
                
                // We herberekenen hoeveel er nog uit cash moet na stap 1
                let alreadyHarvested = isGoodYear ? Math.min(Math.max(0, budget-(p1+p2)), (currentEtfValue+0 - (currentEtfValue+0))) : 0; // versimpeld
                // De simpelste manier:
                let needs = Math.max(0, budget - (p1 + p2));
                // In Good year hebben we al wat uit ETF gehaald, we kijken wat er nog uit CASH moet
                // Maar om bugs te voorkomen doen we een schone onttrekking flow:
                
                let remainingNeeds = Math.max(0, budget - (p1 + p2));
                // Als het een goed jaar was, hebben we al een deel van 'remainingNeeds' uit de ETF gehaald.
                // We moeten dus weten hoeveel er nog over is.
                if (isGoodYear) {
                    let prevEtf = currentEtfValue + (Math.min(remainingNeeds, (currentEtfValue - compoundedThreshold + remainingNeeds*1.0012) / 1.0012) * 1.0012); // benadering
                    // Om fouten te vermijden voeren we de onttrekking direct uit in de simulatie-stap
                }
                
                // --- CORRECTE ONTTREKKING VOLGORDE ---
                let actualBudgetNeeded = Math.max(0, budget - (p1 + p2));
                // Is al deels voldaan in stap 1 als isGoodYear == true.
                // Hoeveel is er nog over?
                // We houden in de stap 1 herverdeling de 'actualBudgetNeeded' bij.
                // Ik herstructureer de loop voor maximale accuraatheid:
                
                let toWithdraw = Math.max(0, budget - (p1 + p2));
                if (age > state.currentAge && currentEtfValue > compoundedThreshold) {
                    let surplus = currentEtfValue - compoundedThreshold;
                    let taken = Math.min(toWithdraw, surplus / 1.0012);
                    currentEtfValue -= taken * 1.0012;
                    toWithdraw -= taken;
                }
                // Rest uit cash
                let fromCash = Math.min(toWithdraw, Math.max(0, currentCashValue));
                currentCashValue -= fromCash;
                toWithdraw -= fromCash;
                // Rest geforceerd uit ETF
                if (toWithdraw > 0) {
                    let forced = Math.min(toWithdraw, Math.max(0, currentEtfValue / 1.0012));
                    currentEtfValue -= forced * 1.0012;
                    toWithdraw -= forced;
                }

                // --- 3. INLEG DIT JAAR ---
                if (inv > 0) {
                    currentEtfValue += (inv * 0.9988);
                    compoundedThreshold += inv;
                    runningTotalInvested += inv;
                }

                const displayThreshold = compoundedThreshold;

                // --- 4. MARKTGROEI ---
                const dataIndex = state.shuffleIndices[yearIdx % activeEtfReturns.length];
                const annualReturn = activeEtfReturns[dataIndex];
                if (currentEtfValue > 0) currentEtfValue *= (1 + annualReturn);

                const totalAtEnd = currentEtfValue + currentCashValue;
                if (totalAtEnd <= 0) rowColorClass = "row-bankrupt";

                // --- 5. INDEXERING DREMPEL ---
                compoundedThreshold *= (1 + thresholdPct);

                // UI
                const row = document.createElement('tr');
                row.className = `border-b group active:bg-slate-100 transition ${rowColorClass}`;
                
                const cell = (type, val, cls='') => `
                    <td class="p-1 border-slate-200/50">
                        <div class="input-group">
                            <input type="number" value="${Math.round(val)||''}" placeholder="0" class="input-cell ${cls}" onchange="updateManualVal(${age}, '${type}', this.value)">
                            <span class="fill-btn no-print" onclick="fillDown(${age}, '${type}')">⬇️</span>
                        </div>
                    </td>`;

                row.innerHTML = `
                    <td class="p-3 font-bold border-r text-center text-slate-400 bg-slate-50/20">${age}</td>
                    ${cell('p1', p1)} ${cell('p2', p2)} ${cell('inv', inv, 'text-blue-600 font-bold')} ${cell('budget', budget, 'font-black text-slate-900')}
                    <td class="p-3 text-right font-mono border-l ${annualReturn>=0?'text-green-600':'text-red-500'}">${(annualReturn*100).toFixed(1)}%</td>
                    <td class="p-3 text-right font-mono text-blue-600">€${Math.round(runningTotalInvested).toLocaleString('nl-BE')}</td>
                    <td class="p-3 text-right font-mono text-orange-600 font-bold">€${Math.round(displayThreshold).toLocaleString('nl-BE')}</td>
                    <td class="p-3 text-right font-mono font-bold">€${Math.round(currentEtfValue).toLocaleString('nl-BE')}</td>
                    <td class="p-3 text-right font-mono">€${Math.round(currentCashValue).toLocaleString('nl-BE')}</td>
                    <td class="p-3 text-right font-mono font-black border-l bg-slate-50/20">€${Math.round(totalAtEnd).toLocaleString('nl-BE')}</td>
                `;
                tbody.appendChild(row);

                if (age === state.currentAge) document.getElementById('thresholdValueText').innerText = `€ ${Math.round(displayThreshold).toLocaleString('nl-BE')}`;
                if (age === 90) {
                    document.getElementById('endResultText').innerText = `€ ${Math.round(totalAtEnd).toLocaleString('nl-BE')}`;
                    document.getElementById('totalReturnText').innerText = runningTotalInvested > 0 ? Math.round(((totalAtEnd / runningTotalInvested)-1)*100)+"%" : "0%";
                    document.getElementById('totalInlayText').innerText = `€ ${Math.round(runningTotalInvested).toLocaleString('nl-BE')}`;
                }
            }
        }

        window.onload = () => { loadState(); runSimulation(); };
    </script>
</body>
</html>
